<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen KTP | IT UMY</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/Style.css">
</head>
<body>

<div class="background-glow"></div>

<div class="container py-5">
    <div class="header-section text-center mb-5">
        <div class="badge bg-soft-primary text-primary mb-2 px-3 py-2">Pertemuan 3 - Deployment</div>
        <h1 class="fw-bold text-dark">Manajemen Data Penduduk</h1>
        <p class="text-secondary">Sistem CRUD KTP Digital Terintegrasi</p>
    </div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="glass-card shadow-sm p-4">
                <div class="d-flex align-items-center mb-4">
                    <div class="icon-box bg-primary text-white me-3">
                        <i class="fas fa-id-card"></i>
                    </div>
                    <h5 class="mb-0 fw-bold" id="formTitle">Form Identitas</h5>
                </div>

                <form id="ktpForm">
                    <input type="hidden" id="id">

                    <div class="form-floating mb-3">
                        <input type="text" id="nomorKtp" class="form-control" placeholder="16 Digit NIK" required>
                        <label for="nomorKtp">Nomor KTP (NIK)</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="text" id="namaLengkap" class="form-control" placeholder="Nama Lengkap" required>
                        <label for="namaLengkap">Nama Lengkap</label>
                    </div>

                    <div class="form-floating mb-3">
                        <textarea id="alamat" class="form-control" style="height: 100px" placeholder="Alamat" required></textarea>
                        <label for="alamat">Alamat Lengkap</label>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="small fw-bold text-muted mb-1">Tgl Lahir</label>
                                <input type="date" id="tanggalLahir" class="form-control" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="small fw-bold text-muted mb-1">Gender</label>
                                <select id="jenisKelamin" class="form-select" required>
                                    <option value="">Pilih...</option>
                                    <option value="Laki-laki">Laki-laki</option>
                                    <option value="Perempuan">Perempuan</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2 pt-3">
                        <button type="submit" class="btn btn-primary btn-lg shadow-sm" id="btnSubmit">
                            <i class="fas fa-save me-2"></i> Simpan Data
                        </button>
                        <button type="button" class="btn btn-light text-muted" onclick="resetForm()">
                            Reset
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="glass-card shadow-sm p-4 h-100">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold mb-0">Database Penduduk</h5>
                    <button class="btn btn-sm btn-soft-primary" onclick="loadKtpData()">
                        <i class="fas fa-sync-alt me-1"></i> Refresh
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="table table-custom">
                        <thead>
                        <tr>
                            <th>NIK</th>
                            <th>Nama Lengkap</th>
                            <th>Gender</th>
                            <th class="text-end">Aksi</th>
                        </tr>
                        </thead>
                        <tbody id="ktpTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
